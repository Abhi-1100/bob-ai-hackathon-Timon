submission:
  title: "ThreatIntel — Threat Intelligence Correlation & Alert Prioritisation Assistant" # REQUIRED — Project display name

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Security Operations Centers and defense analysts face acute alert fatigue from tens of thousands of fragmented, multi-source alerts daily. High false-positive rates and incompatible schemas obscure coordinated intrusions and delay critical executive decision cycles.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    ThreatIntel correlates cross-domain security alerts into structured attack chains, automatically maps threat behaviors to the MITRE ATT&CK framework, dynamically ranks multi-tier risks, and generates executive BLUF briefings with an interactive LangGraph AI copilot.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Cross-feed alert correlation and multi-stage attack chain grouping across temporal and asset heuristics"
    - "Automated MITRE ATT&CK enterprise technique mapping and tactical tagging"
    - "Deterministic multi-factor threat risk scoring and prioritization (Critical, High, Medium, Low)"
    - "Autonomous executive BLUF summary synthesis and tactical action recommendation generation"
    - "Conversational SOC analyst copilot with LangGraph workflow and Qdrant grounded vector retrieval"

  tech_stack:
    languages: ["Python", "JavaScript", "SQL"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React", "LangGraph", "LangChain"]     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["watsonx.ai", "IBM Bob"]                     # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["SQLite", "PostgreSQL", "Qdrant Vector Database"]   # e.g., ["PostgreSQL", "Redis"]
    other: ["Docker", "GitHub Actions", "Vite", "Pytest"]          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    A seamless, end-to-end operational intelligence pipeline that transforms noisy raw alert streams into mathematically grounded risk rankings, MITRE-mapped attack chains, commander-ready BLUF briefs, and real-time interactive analyst RAG dialogues.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    In offline development environments, Qdrant operates in in-memory mode and LLM calls can utilize Groq Llama 3.3 fallbacks when watsonx cloud credentials are not configured.

