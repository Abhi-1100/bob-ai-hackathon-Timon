services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: timontrack
      POSTGRES_USER: timontrack
      POSTGRES_PASSWORD: timontrack
    ports: ["5432:5432"]
    volumes: ["timontrack-db:/var/lib/postgresql/data"]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["timontrack-qdrant:/qdrant/storage"]

  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://timontrack:timontrack@db:5432/timontrack
      QDRANT_URL: http://qdrant:6333
      JWT_SECRET: ${JWT_SECRET:-local-dev-change-me}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports: ["8000:8000"]
    depends_on: [db, qdrant]

  frontend:
    build:
      context: src/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports: ["5173:80"]
    depends_on: [backend]

volumes:
  timontrack-db:
  timontrack-qdrant:
